<div class="pointer-events-none fixed inset-x-4 top-4 z-50 flex flex-col items-end gap-3 sm:left-auto sm:right-6 sm:w-96"
    aria-live="polite" aria-atomic="false">

    @for (toast of toastService.toasts(); track toast.id) {
    <div class="pointer-events-auto flex w-full items-start gap-3 rounded-xl border bg-white p-4 shadow-lg"
        [class.border-emerald-200]="toast.type === 'success'" [class.border-red-200]="toast.type === 'error'"
        [class.border-amber-200]="toast.type === 'warning'" [class.border-blue-200]="toast.type === 'info'">

        <div class="min-w-0 flex-1">
            <p class="text-sm font-medium" [class.text-emerald-700]="toast.type === 'success'"
                [class.text-red-700]="toast.type === 'error'" [class.text-amber-700]="toast.type === 'warning'"
                [class.text-blue-700]="toast.type === 'info'">

                {{ toast.message }}
            </p>
        </div>

        <button type="button"
            class="rounded-lg px-2 py-1 text-sm text-slate-500 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500"
            aria-label="Dismiss notification" (click)="dismissToast(toast.id)">

            ✕
        </button>
    </div>
    }
</div>
