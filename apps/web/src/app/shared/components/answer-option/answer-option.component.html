<button type="button"
    class="flex min-h-10 w-full items-center gap-3 border-0 bg-transparent px-3 py-2 text-left outline-none transition-colors hover:bg-slate-50 focus:bg-slate-50"
    [ngClass]="{
            'text-slate-900': selected,
            'text-slate-700': !selected
        }" role="radio" [attr.aria-checked]="selected" [attr.aria-label]="'Option ' + option.value"
    (click)="onSelect()">
    <span class="w-6 shrink-0 text-right text-sm font-bold text-slate-700">
        {{ optionLetter }}.
    </span>

    <span class="flex h-4 w-4 shrink-0 items-center justify-center rounded-full border-2" [ngClass]="
                selected
                    ? 'border-[#0789bd] bg-[#0789bd]'
                    : 'border-slate-400 bg-white'
            " aria-hidden="true">
        @if (selected) {
        <span class="h-1.5 w-1.5 rounded-full bg-white"></span>
        }
    </span>

    <span class="text-base font-medium sm:text-lg">
        {{ option.value }}
    </span>
</button>
