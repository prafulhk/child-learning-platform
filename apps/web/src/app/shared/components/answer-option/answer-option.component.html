<button type="button"
    class="answer-option flex min-h-11 w-full items-center gap-3 rounded-xl border-2 px-4 py-3 text-left text-lg font-semibold transition-colors"
    [ngClass]="
    selected
      ? 'selected border-blue-600 bg-blue-50 text-slate-900'
      : 'border-slate-300 bg-white text-slate-900'
  " role="radio" [attr.aria-checked]="selected" [attr.aria-label]="'Option ' + option.value" (click)="onSelect()">
    <span class="indicator h-4 w-4 flex-none rounded-full border-2"
        [ngClass]="selected ? 'border-blue-600 bg-[radial-gradient(circle,_#2563eb_45%,_transparent_46%)]' : 'border-slate-500'"
        aria-hidden="true"></span>
    <span class="value">{{ option.value }}</span>
</button>
