<p>Selected: {{ selected }}</p>
<button type="button"
    class="answer-option flex min-h-11 w-full items-center gap-3 rounded-xl border-2 border-slate-300 bg-white px-4 py-3 text-left text-lg font-semibold outline-none transition-colors"
    [ngClass]="{
        'border-blue-600 bg-blue-50': selected,
        'border-slate-300 bg-white': !selected
    }" role="radio" [attr.aria-checked]="selected" [attr.aria-label]="'Option ' + option.value" (click)="onSelect()">

    <span class="indicator h-4 w-4 flex-none rounded-full border-2" [ngClass]="selected
            ? 'border-blue-600 bg-blue-600'
            : 'border-slate-500 bg-white'" aria-hidden="true">
    </span>

    <span class="value">{{ option.value }}</span>
</button>
