<button
    type="button"
    class="flex min-h-8 w-full items-center justify-center gap-1 border-0 bg-transparent px-2 py-1 text-left outline-none transition-colors hover:bg-slate-50 focus:bg-slate-50"
    [ngClass]="{
        'text-slate-900': selected,
        'text-slate-700': !selected
    }"
    role="radio"
    [attr.aria-checked]="selected"
    [attr.aria-label]="'Option ' + option.value"
    (click)="onSelect()"
>
    <!-- OPTION LETTER -->
    <span
        class="w-4 shrink-0 text-right text-xs font-bold sm:text-sm"
    >
        {{ optionLetter }}.
    </span>

    <!-- RADIO -->
    <span
        class="flex h-3.5 w-3.5 shrink-0 items-center justify-center rounded-full border"
        [ngClass]="
            selected
                ? 'border-[#0789bd] bg-[#0789bd]'
                : 'border-slate-400 bg-white'
        "
        aria-hidden="true"
    >
        @if (selected) {
        <span class="h-1.5 w-1.5 rounded-full bg-white"></span>
        }
    </span>

    <!-- VALUE -->
    <span class="text-xs font-medium sm:text-sm">
        {{ option.value }}
    </span>
</button>
