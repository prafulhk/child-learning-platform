<section class="mx-auto w-full max-w-3xl px-4 py-6">
    <div class="mb-6 text-center">
        <h1 class="text-2xl font-bold text-slate-900">
            {{ assessmentTitle }}
        </h1>

        <p class="mt-2 text-sm text-slate-600">
            Abacus assessment
        </p>
    </div>

    <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
        <div class="grid gap-4 sm:grid-cols-2">
            <div class="rounded-xl border border-slate-200 bg-slate-50 p-5 text-center">
                <div class="text-sm font-medium text-slate-500">
                    Questions
                </div>

                <div class="mt-1 text-2xl font-bold text-slate-900">
                    {{ config.questionCount }}
                </div>
            </div>

            <div class="rounded-xl border border-slate-200 bg-slate-50 p-5 text-center">
                <div class="text-sm font-medium text-slate-500">
                    Duration
                </div>

                <div class="mt-1 text-2xl font-bold text-slate-900">
                    {{ config.durationSeconds / 60 }} Minutes
                </div>
            </div>
        </div>

        <div class="mt-6 grid gap-3 sm:grid-cols-2">
            <button type="button" class="min-h-12 rounded-xl bg-blue-600 px-4 py-3 text-sm font-semibold text-white"
                (click)="onStart()">
                Start Test
            </button>

            <button type="button" class="min-h-12 rounded-xl bg-slate-800 px-4 py-3 text-sm font-semibold text-white"
                (click)="onBack()">
                Back
            </button>
        </div>
    </div>
</section>
