<section class="app-page-shell app-page-shell--standard">
    <header class="text-center">
        <h1 class="text-3xl font-bold text-slate-900">Parent Tools</h1>
    </header>

    <div class="mt-6 space-y-3 rounded-2xl bg-white p-5 shadow-sm ring-1 ring-slate-200">
        <button type="button"
            class="min-h-11 w-full rounded-xl bg-blue-600 px-4 py-3 text-lg font-semibold text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
            (click)="onOpenQuestionBank()">
            Question Bank
        </button>

        <button type="button"
            class="min-h-11 w-full rounded-xl bg-slate-800 px-4 py-3 text-lg font-semibold text-white focus:outline-none focus:ring-2 focus:ring-slate-500 focus:ring-offset-2"
            (click)="onBackToHome()">
            Back to Home
        </button>
    </div>
</section>
