<section class="app-page-shell app-page-shell--standard">
  <!-- Header with gradient -->
  <header
    class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-indigo-700 via-indigo-600 to-blue-600 px-5 py-8 text-white shadow-xl sm:px-10 sm:py-10">
    <!-- Decorative background -->
    <div class="pointer-events-none absolute -right-16 -top-20 h-48 w-48 rounded-full bg-white/10"></div>
    <div class="pointer-events-none absolute -bottom-24 -left-16 h-48 w-48 rounded-full bg-white/10"></div>

    <div class="relative">
      <div class="mb-3 text-4xl" aria-hidden="true">📚</div>

      <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">
        Daily Practice
      </h1>

      <p class="mt-2 text-indigo-100 text-base">
        Build your skills with targeted practice sessions.
      </p>
    </div>
  </header>

  <!-- Topics Grid -->
  <div class="mt-8 space-y-3">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-semibold text-slate-900">
        Select a topic
      </h2>
      <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">
        {{ topics.length }} Available
      </span>
    </div>

    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3">
      @for (topic of topics; track topic.id) {
      <button type="button"
        class="group cursor-pointer rounded-2xl border border-slate-200 bg-white p-4 text-left shadow-sm transition-all duration-200 hover:-translate-y-1 hover:border-indigo-400 hover:bg-indigo-50/30 hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
        (click)="onStartPractice(topic.id)"
        [attr.aria-label]="'Start ' + topic.name + ' practice with ' + topic.questionCount + ' questions'">

        <!-- Icon and Title -->
        <div class="flex items-start justify-between">
          <div>
            <h3 class="font-semibold text-slate-900">{{ topic.name }}</h3>
            <p class="mt-1 text-xs text-slate-500">{{ topic.description }}</p>
          </div>
          <div class="text-2xl" aria-hidden="true">{{ topic.icon }}</div>
        </div>

        <!-- Stats -->
        <div class="mt-4 grid grid-cols-2 gap-2 rounded-lg bg-slate-50 p-2">
          <div class="text-center">
            <p class="text-xs font-medium text-slate-600">Questions</p>
            <p class="mt-0.5 text-sm font-bold text-slate-900">{{ topic.questionCount }}</p>
          </div>
          <div class="text-center">
            <p class="text-xs font-medium text-slate-600">Duration</p>
            <p class="mt-0.5 text-sm font-bold text-slate-900">{{ topic.durationMinutes }}m</p>
          </div>
        </div>

        <!-- Arrow indicator -->
        <div class="mt-3 flex items-center justify-end">
          <span class="text-base text-indigo-500 transition-transform duration-200 group-hover:translate-x-1"
            aria-hidden="true">
            →
          </span>
        </div>
      </button>
      }
    </div>
  </div>

  <!-- History Button -->
  <div class="mt-8">
    <button type="button"
      class="w-full rounded-xl border-2 border-slate-300 bg-white px-4 py-3 font-semibold text-slate-700 transition hover:border-slate-400 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-500 focus:ring-offset-2"
      (click)="onViewHistory()">
      View Practice History
    </button>
  </div>
</section>
