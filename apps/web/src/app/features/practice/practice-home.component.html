<section class="mx-auto w-full max-w-md px-4 py-6">
  <h1 class="text-center text-3xl font-bold text-slate-900">Abacus Learning</h1>

  <div class="mt-6 rounded-2xl bg-white p-5 shadow-sm ring-1 ring-slate-200">
    <h2 class="text-center text-xl font-semibold text-slate-800">Single-Digit Addition</h2>

    <div class="mt-5 grid grid-cols-2 gap-3 text-center">
      <div class="rounded-xl bg-slate-50 p-3 ring-1 ring-slate-200">
        <p class="text-sm font-medium text-slate-600">Practice</p>
        <p class="mt-1 text-lg font-bold text-slate-900">10 Questions</p>
      </div>

      <div class="rounded-xl bg-slate-50 p-3 ring-1 ring-slate-200">
        <p class="text-sm font-medium text-slate-600">Duration</p>
        <p class="mt-1 text-lg font-bold text-slate-900">5 Minutes</p>
      </div>
    </div>

    <div class="mt-6">
      <button type="button"
        class="min-h-11 w-full rounded-xl bg-blue-600 px-4 py-3 text-lg font-semibold text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
        (click)="onStartPractice()">
        Start Practice
      </button>
    </div>
  </div>
</section>
